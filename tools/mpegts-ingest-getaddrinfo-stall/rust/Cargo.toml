[package]
name = "nimdiag"
version = "0.2.0"
edition = "2021"
description = "Read-only MPEG-TS ingest diagnostics for Nimble Streamer hosts and an offline analyzer for blocked-resolver ingest stalls"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
